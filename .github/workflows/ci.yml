name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        id: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Offline suites: committed fixtures and scripted LLM roles. No secrets,
      # no network. Separate steps so each suite reports on its own; the agent
      # step still runs when the engineering step fails.
      - name: Engineering tests
        run: pytest -q tests/engineering
      - name: Agent governance tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pytest -q tests/agent
