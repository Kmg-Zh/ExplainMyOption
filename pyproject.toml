[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "explain-my-option"
version = "0.1.0"
description = "Diagnose why an equity option price moved (Greeks + news narrative)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2,<2",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "QuantLib>=1.43",
    "yfinance>=0.2.40",
    "tavily-python>=0.5.0",
    "streamlit>=1.36",
    "python-dotenv>=1.0",
]

[project.scripts]
explain-my-option = "app:run_cli"

[tool.setuptools.packages.find]
where = ["src"]
